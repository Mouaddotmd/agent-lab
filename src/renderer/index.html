<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none'">
<title>Agent Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="discord.css">
</head>
<body>
<header class="top" id="top"></header>
<div class="win" id="win">
  <nav class="rail" id="rail" aria-label="Workspaces"></nav>
  <div class="sheet" id="sheet">
    <aside class="side" id="side" aria-label="Sidebar"></aside>
    <main class="main"><header class="strip" id="strip"></header><div class="view scroll" id="view"></div></main>
    <aside class="now" id="now" aria-label="Right now"></aside>
    <div class="scrim" id="scrim"></div>
  </div>
</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
